plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex('net\\.runelite.*')
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
dependencies {
    implementation('io.github.jaredmdobson:concentus:1.0.2') {
        transitive = false
    }
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

group = 'com.rsvc'
version = '1.0.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    useJUnit()
}

// Exact artifact approved by the user. Verification is build-time only.
tasks.register('verifyConcentus') {
    inputs.files(configurations.runtimeClasspath)
    doLast {
        def codec = configurations.runtimeClasspath.files.findAll { it.name == 'concentus-1.0.2.jar' }
        if (codec.size() != 1) {
            throw new GradleException('Expected exactly Concentus 1.0.2')
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
            .digest(codec.first().bytes).encodeHex().toString()
        if (digest != '3584da8a1ac7e0814a03ce3c1b1e70250bf7b07668bc39eea1048796d6471ce3') {
            throw new GradleException('Concentus differs from the approved artifact; do not bypass verification')
        }
    }
}
tasks.named('compileJava') {
    dependsOn 'verifyConcentus'
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsvc.RsVcPluginTest'
    jvmArgs '-ea'
    args '--developer-mode'
}

// Guard the release boundary even when optional local tooling is present.
tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { archive ->
            def forbidden = archive.entries().findAll { entry ->
                entry.name.startsWith('com/rsvc/dev/') ||
                    entry.name.startsWith('com/rsvc/diagnostics/') ||
                    entry.name.contains('MicRecording') || entry.name.contains('MicrophoneTest') ||
                    entry.name.contains('VoiceDiagnostics') || entry.name.contains('VoiceMetrics')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Development/recording code in release JAR: ${forbidden}")
            }
        }
    }
}
tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}
// Optional local tooling. A clean checkout builds and tests without this ignored directory.
if (!providers.gradleProperty('rsvcMinimal').isPresent() && file('dev/dev.gradle').isFile()) {
    apply from: 'dev/dev.gradle'
}
