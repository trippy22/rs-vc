plugins { id 'java' }

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

group = 'com.rsvc'
version = '0.1.0'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
test { useJUnit() }

// Build-time integrity check only; no file IO is introduced into the plugin.
tasks.register('verifyVendoredCodec') {
    inputs.file('third_party/concentus/provenance.json')
    inputs.dir('src/main/java/org/concentus')
    inputs.files('third_party/concentus/LICENSE', 'src/main/resources/META-INF/CONCENTUS-LICENSE.txt',
        'src/main/resources/META-INF/CONCENTUS-NOTICES.txt')
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(file('third_party/concentus/provenance.json'))
        def digest = { File source -> java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() }
        def actual = fileTree('src/main/java/org/concentus').matching { include '*.java' }.files.collect { it.name }.toSet()
        if (actual != manifest.Files.collect { it.File }.toSet()) throw new GradleException('Vendored codec file list differs from provenance')
        manifest.Files.each { entry ->
            if (!digest(file("src/main/java/org/concentus/${entry.File}")).equalsIgnoreCase(entry.VendoredSha256))
                throw new GradleException("Vendored codec hash mismatch: ${entry.File}")
        }
        ['third_party/concentus/LICENSE', 'src/main/resources/META-INF/CONCENTUS-LICENSE.txt'].each { path ->
            if (!digest(file(path)).equalsIgnoreCase(manifest.LicenseSha256)) throw new GradleException("Codec license changed: ${path}")
        }
        if (!digest(file('src/main/resources/META-INF/CONCENTUS-NOTICES.txt')).equalsIgnoreCase(manifest.NoticesSha256))
            throw new GradleException('Codec notices changed')
    }
}
tasks.named('compileJava') { dependsOn 'verifyVendoredCodec' }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsvc.RsVcPluginTest'
    jvmArgs '-ea'
    args '--developer-mode'
}
tasks.register('wireTest', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsvc.WireIntegration'
    args providers.gradleProperty('relayUrl').getOrElse('ws://127.0.0.1:8787/v1/voice')
}

tasks.register('panelPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsvc.VoicePanelPreview'
    jvmArgs '-Djava.awt.headless=true'
    args layout.buildDirectory.file('panel-preview.png').get().asFile.absolutePath
}
