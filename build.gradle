plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex('net\\.runelite.*')
        }
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

group = 'com.rsvc'
version = '1.0.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

test {
    useJUnit()
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.rsvc.RsVcPluginTest'
    jvmArgs '-ea'
    args '--developer-mode'
}

// Guard the release boundary even when optional local tooling is present.
tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile).withCloseable { archive ->
            def forbidden = archive.entries().findAll { entry ->
                entry.name.startsWith('com/rsvc/dev/') ||
                    entry.name.startsWith('com/rsvc/diagnostics/') ||
                    entry.name.contains('MicRecording') || entry.name.contains('MicrophoneTest') ||
                    entry.name.contains('VoiceDiagnostics') || entry.name.contains('VoiceMetrics')
            }
            if (!forbidden.isEmpty()) {
                throw new GradleException("Development/recording code in release JAR: ${forbidden}")
            }
        }
    }
}
tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}
// Optional local tooling. A clean checkout builds and tests without this ignored directory.
if (!providers.gradleProperty('rsvcMinimal').isPresent() && file('dev/dev.gradle').isFile()) {
    apply from: 'dev/dev.gradle'
}
